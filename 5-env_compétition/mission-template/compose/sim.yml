# Simulation de la mission C sur le poste WSL : `make sim C=<mission>`.
# 1. Le SITL tourne dans Mission Planner sous Windows (formation 1). mavros s'y connecte en TCP.
# 2. Le launch de la mission est le même qu'en vol, avec sim:=true (les nœuds qui touchent au
#    matériel lisent ce paramètre) et site:=sim (config/sites/sim.yaml).
# 3. Les mocks se lancent à la main dans un second terminal : make shell IMG=sim, puis
#    ros2 run sim_mocks rc_simulator (il lit le clavier, donc en avant-plan).
services:
  mavros-sim:
    build:
      context: ..
      dockerfile: docker/dockerfile.mavros
    image: aeac/mavros
    container_name: aeac-mavros-sim
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=3
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
        ros2 launch mavros apm.launch fcu_url:=tcp://${SITL_HOST:-172.17.0.1}:5762 fcu_protocol:=v2.0"

  sim:
    build:
      context: ..
      dockerfile: docker/dockerfile.gcs
    image: aeac/gcs
    container_name: aeac-sim
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    depends_on:
      - mavros-sim
    volumes:
      - ..:/aeac
    working_dir: /aeac/workspaces/${C:-gcs}_ws
    environment:
      - ROS_DOMAIN_ID=3
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command: >
      bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash &&
        ros2 launch ${C:-gcs}_bringup mission.launch.py sim:=true site:=sim"
