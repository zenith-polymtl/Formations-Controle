# Réglages de la mission démo. À copier dans config/demo.yaml du dépôt de mission : le launch
# le charge depuis /aeac/config/demo.yaml. Rien de tout ceci n'est écrit dans le code du nœud.
demo_mission:
  ros__parameters:
    rc:
      # index du GO dans RCIn.channels, donc le canal 8 de la manette (touche w du rc_simulator)
      go_channel: 7
      # PWM à partir duquel l'interrupteur compte comme haut (le rc_simulator envoie 1900)
      go_pwm_min: 1700
    arrival_radius_m: 3.0    # rayon d'arrivée sur le waypoint et sur le retour, mètres
    act_duration_s: 5.0      # durée de l'état ACT, secondes
    state_rate_hz: 2.0       # fréquence du timer : publication de l'état et des setpoints
